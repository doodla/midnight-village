# Ruff configuration for Midnight Village backend
# https://docs.astral.sh/ruff/

line-length = 88
indent-width = 4
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "migrations",
    "staticfiles",
]

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # Pyflakes
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "A",               # flake8-builtins
    "DJ",              # flake8-django
    "S",               # flake8-bandit (security)
    "C4",              # flake8-comprehensions
    "T20",             # flake8-print
    "RUF",             # Ruff-specific
]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "A003",  # Class attribute shadows builtin (Django uses 'id')
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/migrations/*.py" = ["E501", "DJ"]
"**/settings/*.py" = ["F401", "F403", "S105"]
"**/tests/*.py" = ["S101", "S105", "S106"]
"**/tests/**/*.py" = ["S101", "S105", "S106"]

[lint.isort]
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[lint.isort.sections]
django = ["django"]

[format]
quote-style = "double"
indent-style = "space"
