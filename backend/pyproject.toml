[project]
name = "midnight-village-backend"
version = "0.1.0"
description = "Backend for Midnight Village game"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15.2",
    "psycopg[binary]>=3.1.8",
    "psycopg-pool>=3.2.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=23.0.0",
    "channels[daphne]>=4.0.0",
    "channels-redis>=4.2.0",
    "djangorestframework-simplejwt>=5.3.0",
    "regex>=2024.0.0",
    "django-cors-headers>=4.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.1.0",
    "model-bakery>=1.18.0",
    "pyrefly>=0.44.0",
    "pytest-asyncio>=0.23.0",
]
lint = [
    "ruff>=0.8.0",
    "pre-commit>=3.7.0",
    "django-types>=0.19.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--nomigrations",
    "--cov=apps",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--no-cov-on-fail",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests — no HTTP requests, only logic and ORM",
    "integration: tests that exercise the full HTTP or WebSocket stack",
    "contract: tests that verify API response shape and schema contracts",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.pyrefly]
python_version = "3.12"
search_path = ["."]
