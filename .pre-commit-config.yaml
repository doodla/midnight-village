# Pre-commit configuration for Midnight Village monorepo
# https://pre-commit.com/

repos:
  # Backend: Django upgrade
  - repo: https://github.com/adamchainz/django-upgrade
    rev: "1.21.0"
    hooks:
      - id: django-upgrade
        files: ^backend/
        args: [--target-version, "5.1"]

  # Backend: Ruff linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        files: ^backend/
        args: [--fix, --exit-non-zero-on-fix, --config, backend/ruff.toml]
      - id: ruff-format
        files: ^backend/
        args: [--config, backend/ruff.toml]

  # Backend: Pyrefly type checking
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly type check
        entry: bash -c 'cd backend && uv run pyrefly check .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
