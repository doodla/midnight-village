openapi: "3.1.0"
info:
  title: Midnight Village - Health Check API
  version: "1.0.0"
  description: Health check endpoint for monitoring readiness (FR-015)

paths:
  /api/health/:
    get:
      summary: Health check
      description: Returns service health status for monitoring and load balancer probes
      operationId: healthCheck
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required:
                  - status
              example:
                status: ok
