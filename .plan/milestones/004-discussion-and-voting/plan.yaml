id: milestone-004
title: "Discussion and Voting"
status: planned
description: |
  Implement the discussion and voting phases. Discussion is a timed phase
  where players talk in person -- the server just runs a countdown and
  broadcasts timer state. Voting is a simultaneous-lock-in system: every
  player submits a vote target, votes are hidden until the timer expires
  (or all players vote), then all votes are revealed at once.

  After this milestone, the game can progress from night through discussion
  to a completed vote with simultaneous reveal.

success_criteria:
  - Discussion phase starts after night, runs a configurable countdown timer
  - Phase transitions (night->discussion, discussion->voting) are broadcast to all players via WebSocket
  - Vote submission endpoint accepts a target player, enforces one-vote-per-player
  - Votes are hidden until reveal -- no player can see others' votes before the reveal event
  - Simultaneous reveal broadcasts all votes to all players when timer expires or all votes are in
  - Game transitions to results phase after vote reveal

tasks:
  - id: TASK-030
    title: "Phase transition system"
    status: not_started
    assignee: backend-developer
    depends_on: [TASK-002, TASK-020]
    blocks: [TASK-031, TASK-032, TASK-033]
    acceptance:
      - "Pure-Python function validate_phase_transition(current: str, target: str) -> bool with allowed transitions: lobby->night, night->discussion, discussion->voting, voting->results"
      - "Service function transition_phase(game_id, target_phase) that atomically updates Game.phase and broadcasts phase_change event via WebSocket to all players in the game group"
      - "Phase change event payload: {type: 'phase_change', phase: str, timer_seconds: int | None}"
      - "Invalid transitions raise an error and do not modify state"
      - "just check passes"
    tests: both
    test_details:
      - "UNIT: test each valid transition is accepted"
      - "UNIT: test invalid transitions are rejected (e.g. lobby->voting, results->night)"
      - "INTEGRATION: test transition broadcasts phase_change to connected WebSocket clients"

  - id: TASK-031
    title: "Discussion phase with countdown timer"
    status: not_started
    assignee: backend-developer
    depends_on: [TASK-030]
    blocks: [TASK-033]
    acceptance:
      - "When game transitions to discussion phase, server starts a countdown timer (configurable, default 300 seconds / 5 minutes)"
      - "Timer state is broadcast periodically (or clients compute locally from start_time + duration)"
      - "Approach: broadcast discussion_started with {start_time: ISO timestamp, duration_seconds: int} and let clients compute remaining time locally (avoids constant timer broadcasts)"
      - "When timer expires, server automatically transitions to voting phase"
      - "Host can optionally end discussion early via POST /api/onuw/games/<game_id>/end-discussion/ (host-only)"
      - "GET /api/onuw/games/<game_id>/me/ includes phase and timer info in response"
      - "just check passes"
    tests: integration
    test_details:
      - "test discussion phase starts with timer info broadcast"
      - "test host can end discussion early"
      - "test non-host cannot end discussion early"
      - "test discussion auto-transitions to voting when timer expires (short timer in test)"

  - id: TASK-032
    title: "Vote submission endpoint"
    status: not_started
    assignee: backend-developer
    depends_on: [TASK-030]
    blocks: [TASK-033]
    acceptance:
      - "POST /api/onuw/games/<game_id>/vote/ endpoint"
      - "Request body: {target_player_id: int}"
      - "Validates: game is in voting phase, player is in game, player has not already voted, target is a valid player in the game (not self -- though self-vote may be allowed, see open question)"
      - "Stores vote in PlayerRole.vote_target"
      - "Returns 200 with {status: 'submitted'} -- does NOT reveal other votes"
      - "Returns 400 if validation fails, 409 if already voted"
      - "When a vote is submitted, broadcasts {type: 'vote_submitted', player_id: int} to the game group (announces WHO voted, not whom they voted FOR)"
      - "just check passes"
    tests: integration
    test_details:
      - "test player can submit vote"
      - "test player cannot vote twice"
      - "test player cannot vote in wrong phase"
      - "test vote does not reveal target in broadcast"
      - "test non-player cannot vote"

  - id: TASK-033
    title: "Simultaneous vote reveal and transition to results"
    status: not_started
    assignee: backend-developer
    depends_on: [TASK-030, TASK-031, TASK-032]
    blocks: [TASK-034]
    acceptance:
      - "Voting phase has a configurable timer (default 60 seconds)"
      - "When timer expires OR all players have voted (whichever comes first): collect all votes, broadcast simultaneous vote_reveal event to all players"
      - "vote_reveal payload: {type: 'vote_reveal', votes: [{player_id: int, target_player_id: int | null}, ...]} -- includes null for players who did not vote"
      - "After vote reveal, game transitions to results phase"
      - "Players who did not vote in time have null vote_target (abstain)"
      - "just check passes"
    tests: integration
    test_details:
      - "test all players vote, reveal happens immediately"
      - "test timer expires with some players not voting, reveal still happens with nulls"
      - "test vote_reveal contains all players' votes"
      - "test game transitions to results after reveal"

  - id: TASK-034
    title: "Discussion-to-voting end-to-end integration test"
    status: not_started
    assignee: backend-developer
    depends_on: [TASK-033]
    blocks: []
    acceptance:
      - "Test simulates 5 players from discussion through voting reveal"
      - "Flow: night ends -> discussion starts (verify timer broadcast) -> host ends discussion early -> voting starts -> 4 of 5 players vote -> timer expires -> vote_reveal broadcast -> game is in results phase"
      - "Verifies: votes are hidden before reveal, reveal contains all votes (including null for non-voter), phase transitions are correct"
      - "Test is marked @pytest.mark.integration"
      - "just test passes"
    tests: integration
    test_details:
      - "test_discussion_to_voting_e2e: full flow with WebSocket assertions"

open_questions:
  - id: Q-030
    question: "Should players be allowed to vote for themselves? The physical game does not prevent it. Some digital implementations allow it as a Tanner strategy."
    needs: user_decision
  - id: Q-031
    question: "Should there be a 'vote lock' confirmation step, or is a single POST sufficient? In the physical game you point simultaneously. A POST is atomic, but a player might want to change their vote before the reveal."
    needs: user_decision
