name: midnight_village
description: Companion app for Midnight Village - One Night Ultimate Werewolf digital assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management - Riverpod 3.x with code generation
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Routing - type-safe
  go_router: ^17.0.1

  # Networking
  dio: ^5.9.0

  # Storage
  flutter_secure_storage: ^10.0.0

  # Data classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # SVG support

  # Design system fonts
  google_fonts: ^6.2.1

  # Logging
  logger: ^2.6.2
  web_socket_channel: ^3.0.3

  # Keep the screen awake during a game
  wakelock_plus: ^1.6.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.10.4
  riverpod_generator: ^3.0.3
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  go_router_builder: ^4.1.3

  # Testing
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  # Reads lib/design_system/copy/copy.dart's lines for the copy budget test
  analyzer: ^8.4.0

  # Linting
  flutter_lints: ^6.0.0

  # Image processing for golden diff report CLI tool
  image: ^4.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/textures/
    # The skins' art (lib/design_system/skin/art_set.dart). Phone-sized WebP
    # copies; the originals are in docs/design/art/.
    - assets/skins/shadow_paper/roles/
    - assets/skins/shadow_paper/tokens/
    - assets/skins/shadow_paper/scenes/
    # Night print's art, made by tool/linocut_art.py (`just skin-art`). On the
    # web an asset is fetched only when drawn, so a phone in Shadow paper
    # never downloads these.
    - assets/skins/night_print/roles/
    - assets/skins/night_print/tokens/
    - assets/skins/night_print/scenes/
    # Night print's faces: plain assets, loaded with a FontLoader only when
    # that skin is chosen (lib/design_system/skin_loader.dart), so they cost a
    # phone in the default skin nothing at start. Only the weights its type
    # roles use.
    - assets/fonts/rozhaone/RozhaOne-Regular.ttf
    - assets/fonts/alegreyasans/AlegreyaSans-Medium.ttf
    - assets/fonts/alegreyasans/AlegreyaSans-ExtraBold.ttf
    # Shown on the licences page (registerFontLicences in lib/main.dart).
    - assets/fonts/gloock/OFL.txt
    - assets/fonts/figtree/OFL.txt
    - assets/fonts/rozhaone/OFL.txt
    - assets/fonts/alegreyasans/OFL.txt

  # The default skin's type (lib/design_system/skin/skins/shadow_paper.dart):
  # Gloock and Figtree (Latin subsets of the Google Fonts files), loaded by the
  # engine at start. Other skins' faces are assets loaded on demand (above).
  # OFL licences sit beside each family in assets/fonts/.
  fonts:
    - family: Gloock
      fonts:
        - asset: assets/fonts/gloock/Gloock-Regular.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/figtree/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/figtree/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/figtree/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/figtree/Figtree-Bold.ttf
          weight: 700
