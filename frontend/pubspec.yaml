name: midnight_village
description: Companion app for Midnight Village - One Night Ultimate Werewolf digital assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management - Riverpod 3.x with code generation
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Routing - type-safe
  go_router: ^17.0.1

  # Networking
  dio: ^5.9.0

  # Storage
  flutter_secure_storage: ^10.0.0

  # Data classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # SVG support
  flutter_svg: ^2.0.0

  # Logging
  logger: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.10.4
  riverpod_generator: ^3.0.3
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  go_router_builder: ^4.1.3

  # Testing
  mocktail: ^1.0.4
  fake_async: ^1.3.1

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/themes/midnight-village/
    - assets/themes/_placeholder/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/playfair-display/PlayfairDisplay.ttf
        - asset: assets/fonts/playfair-display/PlayfairDisplay.ttf
          weight: 700
        - asset: assets/fonts/playfair-display/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter.ttf
        - asset: assets/fonts/inter/Inter.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-Italic.ttf
          style: italic
