# Main is red: say so in one place, and take it back when main is green.
#
# Every merge is checked again on main itself. Two pull requests that were each green can
# still break main between them; until this, nobody was told, and the next builder met the
# failure as if it were theirs. After each of main's own runs, tool/main_red.py opens ONE
# issue titled "main is red" (or adds a line to it), and closes it when the newest run of
# every watched workflow on main has passed.
#
# It is not a check on a pull request and not a required check: it only reads runs and
# writes that one issue. guardrails/tests/test_workflows.py holds it to that.
name: Main Is Red

on:
  workflow_run:
    workflows: ["Backend Tests", "Flutter Tests", "Deployed Check"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

jobs:
  say-so:
    name: Main is red, or green again
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write  # the one "main is red" issue, nothing else
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # main_red.py writes the issue through gh, not git

      - name: Open, add to or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_COMMIT: ${{ github.event.workflow_run.head_commit.message }}
        run: python3 tool/main_red.py
