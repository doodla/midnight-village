# Backend CI Pipeline
#
# GitHub is the wall: nothing merges to main except by pull request with every check
# green, and the commit gate on a builder's machine only runs what takes seconds. So
# this job runs the whole backend side, against a real PostgreSQL (the tests require
# it for parity with production), by calling the root recipes (the checks are
# defined once, in the justfiles):
#   just check   (ruff lint + format check + pyrefly + makemigrations --check, then
#                 the instruction-link check)
#   just test    (pytest with the coverage floor of 80%, which includes the contract
#                 samples being up to date, then the migration tests against the
#                 real migrations, then the .claude/ guardrail, gate-routing and
#                 workflow tests)
#   just previous-build-check   (when a migration is in the change: main's tests on
#                 the database this change's migrations build)
#
# Required check: "Backend Checks" (the Flutter ones are listed in flutter-tests.yml).
# No paths filter: a required check that does not start would block the merge for ever.

name: Backend Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # `edited`: the guard-edits step reads the description, so fixing it re-runs the check.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# A newer push to the same pull request cancels the run still in progress (never on main).
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # config/settings/test.py reads these (no .env file exists in CI). pytest-django
    # creates its own throwaway test database, so the postgres superuser is enough.
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The database's own log is dumped at the end of the job, errors our tests cause
      # on purpose included, and buried what failed. It keeps quiet here.
      - name: Quiet the database's own log
        run: |
          docker exec "$(docker ps -q --filter ancestor=postgres:16)" \
            psql -U postgres -c "ALTER SYSTEM SET log_min_messages = 'panic'" \
            -c "SELECT pg_reload_conf()"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # uv installs the Python in backend/.python-version on demand.
      - name: Install dependencies
        run: just install

      - name: Lint, format check, type check, migrations, instruction links
        run: just check

      # Both run even when the first fails: one red run shows both.
      - name: Tests
        if: ${{ !cancelled() }}
        env:
          # the run's own report, for "What failed" below
          PYTEST_ADDOPTS: --junitxml=build/junit.xml
        run: just test

      # A pull request that edits a guard test (a rule held for the whole app) must
      # say so and why in its description. Does nothing on a push to main.
      - name: Guard tests are not edited quietly
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        # Kept, so "What failed" can say it again as the job's last lines.
        shell: bash
        run: |
          mkdir -p backend/build
          just guard-edits 2>&1 | tee backend/build/guard-edits.txt

      # Only does work when the change has a migration: the live server migrates
      # the database while the previous build still serves, so that build's own
      # tests are run on a database built by this change's migrations.
      - name: The previous build on this change's database
        if: ${{ !cancelled() }}
        run: just previous-build-check

      # The last lines of a red job name each failed test and its first error line.
      - name: What failed
        if: failure()
        run: |
          tool/failed_tests.py junit backend/build/junit.xml
          # No test failed, or not only a test: what the guard-edits step said.
          if [ -s backend/build/guard-edits.txt ]; then echo; cat backend/build/guard-edits.txt; fi
