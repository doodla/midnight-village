# Android app download: the sideloaded APK, kept at one stable address.
#
# On every push to main that touches frontend/ (and by hand: "Run workflow"), builds
# the release APKs with frontend/tool/build_android.sh and replaces the one asset
# `midnight-village.apk` of ONE rolling GitHub release, tag `android-latest`:
#   https://github.com/doodla/midnight-village/releases/download/android-latest/midnight-village.apk
# The web app's /app address redirects there (frontend/vercel.json); 01 offers it in
# an Android browser. docs/dev/deploy-vercel.md, "Android app download".
#
# This is NOT a check of the merge wall: it never runs on a pull request, is not in
# docs/dev/main-ruleset.json, and has a paths filter on purpose (the checks in
# flutter-tests.yml and backend-tests.yml have none: a required check that does not
# start blocks the merge). guardrails/tests/test_workflows.py holds both to their rules.
#
# The signing key is public by the owner's decision (frontend/android/release-key/):
# there is no secret here.
#
# Least privilege, in two jobs. GitHub gives a token per job, not per step, so:
# - `build` runs everything that is not ours (Java, Flutter, Gradle and the packages
#   they fetch) with a READ token that the checkout does not keep (persist-credentials:
#   false), and hands the APK on as a file;
# - `publish` holds the one write token (`contents: write`: a release asset is
#   repository contents) and runs no code but `gh`, on that file: no checkout, no
#   third-party action. Every action is pinned by commit (the version in a comment).

name: Android App Download

on:
  push:
    branches: ["main"]
    paths: ["frontend/**"]
  workflow_dispatch:

# Nothing the jobs do not name.
permissions:
  contents: read

# One at a time, the later push after the earlier (never cancelling a half-uploaded asset).
concurrency:
  group: android-app-download
  cancel-in-progress: false

env:
  TAG: android-latest
  # The two addresses the app is built with (docs/dev/deploy-vercel.md).
  API_ORIGIN: https://midnight-village-anthelion.vercel.app
  PUBLIC_ORIGIN: https://midnight-village-app-anthelion.vercel.app

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only main publishes (a manual run from another branch would replace the file).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: "3.38.10"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.10-${{ runner.os }}

      - name: Install dependencies
        run: flutter pub get

      # The script builds one APK per processor; the arm64 one (nearly every phone
      # since 2017) is published. A universal APK would be a second build, so none.
      - name: Build release APKs
        run: tool/build_android.sh

      - name: Name the file
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$RUNNER_TEMP/apk/midnight-village.apk"
          ls -l "$RUNNER_TEMP/apk/midnight-village.apk"

      - name: Hand the APK to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/midnight-village.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Android APK
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    # Only this job writes (the release).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Take the APK the build job made
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk

      # The release is made once (not "latest", so it never shadows a real release);
      # after that the asset is replaced in place and the notes name the commit.
      - name: Publish to the rolling release
        run: |
          set -euo pipefail
          notes="The Android app, built from ${GITHUB_SHA} (replaced on every change to the app). Download midnight-village.apk on an Android phone and open it."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Android app" \
              --notes "$notes" \
              --latest=false
          else
            gh release edit "$TAG" --notes "$notes" --latest=false
          fi
          # Never leave the release without its file: upload under a temporary name
          # (retried), then drop the old asset and give the new one the real name.
          repo="${GITHUB_REPOSITORY}"
          tmp="midnight-village-new.apk"
          cp "$RUNNER_TEMP/apk/midnight-village.apk" "$RUNNER_TEMP/$tmp"
          # A leftover from a run that stopped half way.
          for id in $(gh api "repos/$repo/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$tmp\") | .id"); do
            gh api -X DELETE "repos/$repo/releases/assets/$id"
          done
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "$RUNNER_TEMP/$tmp"; then break; fi
            if [ "$attempt" = 3 ]; then echo "upload failed 3 times" >&2; exit 1; fi
            sleep 10
            for id in $(gh api "repos/$repo/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$tmp\") | .id"); do
              gh api -X DELETE "repos/$repo/releases/assets/$id"
            done
          done
          # The first run has no old asset: the loop is then empty.
          for id in $(gh api "repos/$repo/releases/tags/$TAG" --jq ".assets[] | select(.name == \"midnight-village.apk\") | .id"); do
            gh api -X DELETE "repos/$repo/releases/assets/$id"
          done
          new_id=$(gh api "repos/$repo/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$tmp\") | .id")
          gh api -X PATCH "repos/$repo/releases/assets/$new_id" -f name=midnight-village.apk
