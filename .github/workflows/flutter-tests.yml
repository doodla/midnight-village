# Flutter Test CI Pipeline
#
# GitHub is the wall: nothing merges to main except by pull request with every check
# green, and the commit gate on a builder's machine only runs what takes seconds. So
# this workflow runs every frontend check, as independent parallel jobs (a failure in
# one does NOT skip the others). Each job only calls `just` recipes: the checks are
# defined once, in frontend/justfile. Flutter is pinned to one exact version in every
# job (see flutter-version).
#
# Required checks (the job names; docs/dev/running-the-work.md has the settings call):
#   "Analyze and Format", "Release has no debug toolbar", "Widget Tests",
#   "Golden Tests", "Screens strict at 360", "Screens strict at 390",
#   "Integration Tests", "End-to-end Harness", "Web page smoke"
# (the backend's is in backend-tests.yml: "Backend Checks"). No job has a paths
# filter: a required check that does not start would block the merge for ever.
#
# GOLDEN BASELINES:
# One set, made on Linux, in frontend/test/design_system/goldens/. Font
# rasterisation differs per OS, so golden-tagged tests are skipped off Linux
# (frontend/dart_test.yaml); this CI job is the source of truth. To regenerate
# them here:
#   1. Run this workflow manually via GitHub Actions → "Run workflow"
#   2. Set "Regenerate golden baselines" to true
#   3. Download the "linux-golden-baselines" artifact from the completed run
#   4. Extract to frontend/test/design_system/goldens/ and commit

name: Flutter Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: "Regenerate golden baselines"
        type: boolean
        default: false

# A newer push to the same pull request cancels the run still in progress (never on main).
concurrency:
  group: flutter-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Analyze and Format ────────────────────────────────────────────────────
  # The same two recipes the local commit gate runs for frontend changes, and the
  # generated-code check.
  static-checks:
    name: Analyze and Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.10-${{ runner.os }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: just analyze

      - name: Format check
        run: just flutter-format-check

      # The committed *.g.dart / *.freezed.dart are what `just gen` makes now
      # (about 50 s, so GitHub and `just gate-full` only, not the commit gate).
      # Here and not with the widget tests: this job has the time to spare.
      - name: Generated code is current
        run: just gen-check

      # Each of the app's deliberate breaks, in a copy of the tree, must fail its
      # guard's tests (tool/breaks_app.py; the server's run in "Backend Checks").
      - name: The app's guards bite
        if: ${{ !cancelled() }}
        run: just prove-guards --runner flutter

  # ─── Release has no debug toolbar ──────────────────────────────────────────
  # Builds the web app with no --dart-define (what a forgotten flag gives) and
  # fails if the /debug toolbar is in it: the behaviour, not a test of the source.
  release-check:
    name: Release has no debug toolbar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.10-${{ runner.os }}

      - name: Install dependencies
        run: flutter pub get

      - name: Bare build has no debug toolbar
        run: just check-release

  # ─── Widget Tests ──────────────────────────────────────────────────────────
  # In three parts side by side (`flutter test --total-shards 3`): the suite is
  # 165 files and about nine minutes in one job, the longest wait of a pull
  # request by far. "Widget Tests" below is the check the ruleset requires.
  widget-tests-part:
    name: Widget Tests part ${{ matrix.part }} of 3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The asset test compares the bundle with what main holds (a removed
      # picture an open app still asks for): it needs main's file list. The
      # raw-values guard compares screen code with where the branch left main
      # (the merge base): it needs the history.
      - name: Fetch main for the asset comparison
        run: |
          deepen=$([ "$(git rev-parse --is-shallow-repository)" = true ] && echo --unshallow || true)
          git fetch --no-tags $deepen origin +refs/heads/main:refs/remotes/origin/main

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the exact version frontend/pubspec.lock was resolved with.
          # A floating "stable" moves on without warning and, once it passed what
          # the lockfile supports, failed `flutter pub get` in every job. Bump it
          # here (every job) together with the lockfile.
          flutter-version: "3.38.10"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.10-${{ runner.os }}

      - name: Install dependencies
        run: flutter pub get

      # Excludes golden-tagged tests: the golden job runs them
      - name: Widget tests, part ${{ matrix.part }} of 3
        run: just test-widgets ${{ matrix.part }} 3

  # The one required check for the widget tests. The three parts above are not in
  # the ruleset: this job needs them all and passes only when every part ran and
  # passed (a part that failed, was cancelled or was skipped fails it; `always()`
  # makes it run and say so, where a job with a failed need would be skipped,
  # which GitHub counts as passing).
  widget-tests:
    name: Widget Tests
    needs: [widget-tests-part]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part ran and passed
        env:
          PARTS: ${{ needs.widget-tests-part.result }}
        run: |
          echo "the three parts together: $PARTS"
          [ "$PARTS" = "success" ]

  # ─── Screens strict ────────────────────────────────────────────────────────
  # Every screen rendered at 360 and at 390 wide, one job each so they run side by
  # side; fails on a layout overflow, an exception, cut text or a reading-floor
  # breach. No backend, no browser. The pictures are uploaded when it fails, for
  # looking at.
  screens:
    name: Screens strict at ${{ matrix.width }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        width: [360, 390]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.10-${{ runner.os }}

      - name: Install dependencies
        run: flutter pub get

      - name: Screens, strict
        run: just screens ${{ matrix.width }} strict

      # Every word a player reads, on one page made from the code (it is not
      # committed): attached to the run so it can be read without running anything.
      - name: The copy page
        if: ${{ always() && matrix.width == 390 }}
        working-directory: .
        run: python3 tool/copy_page.py --out copy.md

      - name: Upload the copy page
        if: ${{ always() && matrix.width == 390 }}
        uses: actions/upload-artifact@v4
        with:
          name: copy-page
          path: copy.md
          retention-days: 30

      - name: Upload the screens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.width }}
          path: frontend/build/screens/
          retention-days: 7
          if-no-files-found: ignore

  # ─── Golden Tests ──────────────────────────────────────────────────────────
  golden-tests:
    name: Golden Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.10-${{ runner.os }}

      - name: Install dependencies
        run: flutter pub get

      # Regenerate Linux baselines when workflow_dispatch with update_goldens=true
      - name: Regenerate Linux golden baselines
        if: inputs.update_goldens == true
        run: flutter test --dart-define=ENV=dev --update-goldens --tags golden

      - name: Upload regenerated Linux baselines
        if: inputs.update_goldens == true
        uses: actions/upload-artifact@v4
        with:
          name: linux-golden-baselines
          path: frontend/test/design_system/goldens/
          retention-days: 30

      # The one baseline set: frontend/test/design_system/goldens/
      - name: Golden tests
        id: golden-tests
        run: just flutter-test-golden

      - name: Generate golden diff report
        if: failure() && steps.golden-tests.outcome == 'failure'
        run: just flutter-golden-report

      - name: Upload golden diff artifacts
        if: failure() && steps.golden-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff-report
          path: |
            frontend/test/golden_diff_report/
            frontend/test/design_system/failures/
          retention-days: 7
          if-no-files-found: ignore

  # ─── Integration Tests ─────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.10-${{ runner.os }}

      # `flutter drive` on the web needs a WebDriver server listening on :4444.
      # Installing Chrome alone is not enough: without a matching chromedriver
      # the run stops with "Unable to start a WebDriver session for web testing".
      - name: Install Chrome and a matching ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Start ChromeDriver
        run: |
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --port=4444 > chromedriver.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4444/status > /dev/null; then
              echo "ChromeDriver is up"; exit 0
            fi
            sleep 1
          done
          echo "ChromeDriver did not start"; cat chromedriver.log; exit 1

      - name: Install dependencies
        run: flutter pub get

      # Runs headless via web-server device (no Chrome window needed)
      - name: Integration tests
        id: integration-tests
        timeout-minutes: 8
        # Use the Chrome installed above, not the runner's own copy. The driver
        # only talks to the Chrome version it was installed with.
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: just test-integration-ci

      - name: Upload ChromeDriver log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromedriver-log
          path: frontend/chromedriver.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload integration test screenshots
        if: failure() && steps.integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots
          path: frontend/integration_test/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  # ─── End-to-end harness ────────────────────────────────────────────────────
  # The real app against a real backend: `just test-harness` (the same recipe
  # as local; it boots the backend on a free port and runs the e2e suites
  # headless on the Dart VM, no browser). Neither the commit gate nor the other
  # jobs run it, so a change to words or screens is only checked here.
  harness:
    name: End-to-end Harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Read by config/settings/harness.py (the harness-serve recipe creates its
    # own throwaway database; the postgres superuser is enough).
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      # The database's own log is dumped at the end of the job, errors our tests cause
      # on purpose included, and buried what failed. It keeps quiet here.
      - name: Quiet the database's own log
        run: |
          docker exec "$(docker ps -q --filter ancestor=postgres:16)" \
            psql -U postgres -c "ALTER SYSTEM SET log_min_messages = 'panic'" \
            -c "SELECT pg_reload_conf()"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.10-${{ runner.os }}

      - name: Install backend dependencies
        run: just install

      - name: Install frontend dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Harness
        run: just test-harness

      - name: Upload failures and filmstrips
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-filmstrips
          path: frontend/integration_test/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      # After the upload, whose progress lines would bury it: what failed, as the
      # last thing this job's own steps print.
      - name: What failed
        if: failure()
        run: tool/failed_tests.py flutter frontend/build/harness-report.jsonl

  # ─── Web page smoke ────────────────────────────────────────────────────────
  # The built web page in Chromium, served as Vercel serves it: a first visit
  # loads without waiting for the service worker, a return is served by it,
  # and a second build served in its place runs on its first open (a deploy).
  # `just web-smoke` (frontend/tool/web_smoke/), the same recipe as local.
  web-smoke:
    name: Web page smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.10-${{ runner.os }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: flutter pub get

      - name: Install Playwright and Chromium
        run: just web-smoke-setup

      - name: Web page smoke
        run: just web-smoke
